spring.application.name=caminholivre
server.port=${PORT:8080}

# Credenciais: localmente no arquivo .env (ignorado pelo git); no Render, em Environment
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# As tabelas vêm de database/scripts/01_create.sql: o Hibernate não cria nem altera nada
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Sao_Paulo

app.google-client-id=${GOOGLE_CLIENT_ID:}
app.front-url=${FRONT_URL:http://localhost:3000}
# Mensagens de validação sempre em português (o contêiner do Render roda em inglês)
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
# Banco a ~150 ms do Render: menos idas e voltas por consulta
spring.jpa.properties.hibernate.jdbc.fetch_size=100
